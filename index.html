<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

iframe {
  width: 100%;
  height: 100vh;
  border: none;
}

/* Splash Button */
#playBtn {
  position: fixed;
  inset: 0;
  background: #000;
  color: #fff;
  font-size: 20px;
  letter-spacing: 1px;
  border: none;
  z-index: 9999;
  cursor: pointer;
}

/* Optional hint */
#hint {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>

<body>

<!-- Splash Screen -->
<button id="playBtn">
  Buka Undangan
  <div id="hint">Tap untuk memutar musik</div>
</button>

<!-- Background Music -->
<audio id="bgm" loop preload="auto">
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<!-- Canva Website -->
<iframe
  src="https://www.canva.com/design/DAG6hjdHejU/Ay_QY3z66Y2v0j2mqeVwEA/view?utm_content=DAG6hjdHejU&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h5e41820a36"
  allow="autoplay; fullscreen"
  loading="lazy"
  referrerpolicy="no-referrer">
</iframe>

<script>
const btn = document.getElementById('playBtn');
const audio = document.getElementById('bgm');

btn.addEventListener('click', () => {
  audio.play().catch(() => {
    alert("Aktifkan suara untuk memutar musik");
  });
  btn.style.display = 'none';
});
</script>

</body>
</html>
