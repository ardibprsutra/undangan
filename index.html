<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grand Opening</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: #52736b;
      font-family: 'Arial', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .bird {
      width: 80px;
      margin-bottom: 20px;
    }

    .grand-opening {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      line-height: 1.2;
      margin: 0;
    }

    .branch-info {
      font-size: 22px;
      margin-top: 30px;
      font-weight: 600;
    }

    .flower {
      width: 120px;
      margin-top: 40px;
    }

    #play-music-btn {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="https://i.ibb.co/Fz94Lb7/bird-gold.png" alt="Bird Gold" class="bird" />
  <h1 class="grand-opening">Grand<br />Opening</h1>
  <div class="branch-info">
    Kantor Cabang <br />
    PT BPR Bunga Sutra Mas
  </div>
  <img src="https://i.ibb.co/L54BTfX/white-lily-flower.png" alt="White Lily Flower" class="flower" />

  <!-- Tombol untuk mainkan musik -->
  <button id="play-music-btn">Putar Musik</button>

  <!-- Audio background -->
  <audio id="bg-music" src="your-music-file.mp3" loop></audio>

  <script>
    const btn = document.getElementById('play-music-btn');
    const music = document.getElementById('bg-music');
    
    btn.addEventListener('click', () => {
      music.play();
      btn.style.display = 'none'; // sembunyikan tombol setelah diputar
    });
  </script>
</body>
</html>
